name: tests
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (includes wallet library and pytest)
        run: pip install -e ".[dev]"
      - name: Build optional native extension
        run: |
          pip install setuptools wheel
          python setup.py build_ext --inplace
      - name: Run full test suite
        run: set -o pipefail; pytest -v | tee pytest_output.txt
      - name: Keep the test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output-py${{ matrix.python-version }}
          path: pytest_output.txt
