name: Covenant.AI Ultimate CI/CD

on:
  push:
    branches: [main, develop]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  PYTHONPATH: src

jobs:
  # -------------------------
  # Covenant Integrity Guard
  # -------------------------
  covenant-guard:
    runs-on: ubuntu-latest
    outputs:
      covenant-ok: ${{ steps.check.outputs.covenant_ok }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect covenant modifications
        id: check
        run: |
          git fetch origin main --depth=1
          CHANGED=$(git diff --name-only origin/main...HEAD)
          echo "$CHANGED"
          if echo "$CHANGED" | grep -q "^covenant/"; then
            echo "::set-output name=covenant_ok::false"
            exit 1
          else
            echo "::set-output name=covenant_ok::true"
          fi

      - name: Comment on PR if covenant modified
        if: github.event_name == 'pull_request' && github.event.pull_request != null && failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            if (pr) {
              github.rest.issues.createComment({
                issue_number: pr.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: "❌ PR blocked: Changes to `covenant/` directory are not allowed."
              });
            } else {
              console.log("No PR found, skipping comment.");
            }

  # -------------------------
  # Lint + Type Check
  # -------------------------
  lint-type:
    needs: covenant-guard
    if: needs.covenant-guard.outputs.covenant_ok == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install linting deps
        run: pip install --upgrade pip black mypy pylint
      - name: Run Black
        run: black --check --diff covenant/ tests/ workflows/
      - name: Run Mypy
        run: mypy --strict covenant/ tests/ workflows/
      - name: Run Pylint
        run: pylint --rcfile=.pylintrc covenant/ tests/ workflows/ || true

  # -------------------------
  # Unit + Integration Tests
  # -------------------------
  tests:
    needs: covenant-guard
    if: needs.covenant-guard.outputs.covenant_ok == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: pip install --upgrade pip && pip install -r requirements.txt || echo "No requirements.txt"
      - name: Run pytest
        run: pytest tests/unit tests/integration --cov=covenant --cov-report=xml --junitxml=junit/test-results-${{ matrix.python-version }}.xml
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: coverage.xml
          fail_ci_if_error: false
      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-${{ matrix.python-version }}
          path: |
            junit/
            coverage.xml
            .pytest_cache

  # -------------------------
  # Smoke Tests
  # -------------------------
  smoke-tests:
    needs: covenant-guard
    if: needs.covenant-guard.outputs.covenant_ok == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: 3.10
      - name: Install deps
        run: pip install -r requirements.txt || echo "No requirements.txt"
      - name: Run workflows
        run: |
          for wf in workflows/*.py; do
            python $wf
          done

  # -------------------------
  # Security Scan
  # -------------------------
  security:
    needs: covenant-guard
    if: needs.covenant-guard.outputs.covenant_ok == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install safety==3.6.0 typer==0.9.0 "rich<14"
      - name: Run Safety Security Scan
        run: |
          if [ -f requirements.txt ]; then
            safety check --disable-audit-and-monitor --full-report -r requirements.txt || exit 1
          else
            echo "No requirements.txt found, skipping Safety scan."
          fi
      - name: Upload Safety report
        if: always()
        run: safety check --full-report -r requirements.txt --json > safety-report.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: safety-report
          path: safety-report.json

  # -------------------------
  # Docker Build - Main Branch (timestamp)
  # -------------------------
  docker-ci:
    needs: covenant-guard
    if: github.ref == 'refs/heads/main' && needs.covenant-guard.outputs.covenant_ok == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image (timestamp tag)
        run: |
          IMAGE_TAG="my-image-name:$(date +%s)"
          docker build --file Dockerfile --tag $IMAGE_TAG .

  # -------------------------
  # Docker Build - Release Tag
  # -------------------------
  docker-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build Docker image (release tag)
        run: |
          docker build --build-arg VERSION=${{ github.ref_name }} --file docker/Dockerfile --tag covenant-ai:${{ github.ref_name }} .
      - name: Push Docker image
        run: docker push covenant-ai:${{ github.ref_name }}

  # -------------------------
  # PR Comment Notification (PR-Safe)
  # -------------------------
  pr-comment:
    needs: [lint-type, tests, smoke-tests, security]
    if: github.event_name == 'pull_request' && github.event.pull_request != null
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              console.log("No PR found, skipping comment.");
            } else {
              let comment = `### CI Results\n`;
              comment += `Covenant Guard: ${{ needs.covenant-guard.result }}\n`;
              comment += `Lint/Type (3.9-3.11): ${{ needs.lint-type.result }}\n`;
              comment += `Tests (3.9-3.11): ${{ needs.tests.result }}\n`;
              comment += `Smoke: ${{ needs.smoke-tests.result }}\n`;
              comment += `Security Scan: ${{ needs.security.result }}\n`;
              comment += "\n*Full logs and Safety report available in Actions artifacts.*";
              github.rest.issues.createComment({
                issue_number: pr.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }
