name: Security Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  safety:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install security tools
        run: |
          pip install --upgrade pip
          pip install "safety<3.6" "typer<0.10" "rich<14"

      - name: Run Safety (requirements.txt only)
        run: |
          safety check \
            --full-report \
            -r requirements.txt
