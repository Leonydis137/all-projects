name: CI
on:
  push:
    branches: [main, unified]
  pull_request:
jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        shell: bash
        run: |
          set -euo pipefail
          test -s merged/sources/projects.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          source = Path("merged/sources/projects.json")
          payload = json.loads(source.read_text(encoding="utf-8"))
          projects = payload.get("projects")
          if not isinstance(projects, list):
              raise SystemExit("projects.json must contain a projects array")
          selected = [
              p for p in projects
              if isinstance(p, dict) and p.get("kind") in ("node", "python")
              and isinstance(p.get("path"), str) and p["path"]
          ]
          if not selected:
              raise SystemExit("No node/python projects found for CI matrix")
          matrix = {"include": selected}
          encoded = json.dumps(matrix, separators=(",", ":"))
          print(f"Selected {len(selected)} projects; matrix payload {len(encoded)} bytes")
          print("matrix=" + encoded)
          PY
  test:
    needs: detect
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: bash merged/sources/scripts/projects.sh install ${{ matrix.path }}
      - run: bash merged/sources/scripts/projects.sh test ${{ matrix.path }}
  platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify platform test inputs
        run: |
          set -euxo pipefail
          test -s merged/platform/requirements.txt
          test -d merged/platform/omnis
          test -d merged/platform/tests
          python --version
      - name: Install platform dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r merged/platform/requirements.txt
          python -m pip check
      - name: Run platform contract tests
        env:
          PYTHONPATH: merged/platform
          OMNIS_API_TOKEN: ci-test-token
          OMNIS_EVIDENCE_DB: ${{ runner.temp }}/omnis-evidence.sqlite3
        run: python -m pytest -vv --tb=short merged/platform/tests
