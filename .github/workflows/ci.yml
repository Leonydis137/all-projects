name: CI
on:
  push:
    branches: [main, unified]
  pull_request:
jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          projects = json.load(open("merged/sources/projects.json"))["projects"]
          selected = [p for p in projects if p["kind"] in ("node", "python")]
          print("matrix=" + json.dumps({"include": selected}))
          PY
  test:
    needs: detect
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: bash merged/sources/scripts/projects.sh install ${{ matrix.path }}
      - run: bash merged/sources/scripts/projects.sh test ${{ matrix.path }}
  platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r merged/platform/requirements.txt
      - run: python -m pip install pytest
      - run: PYTHONPATH=merged/platform python -m pytest -q merged/platform/tests
