name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest flake8 "safety<3.6" "typer<0.10" "rich<14"

      - name: Run flake8 (PEP8)
        run: flake8 src covenant api --max-line-length=100 || true

      # Crucial: set PYTHONPATH **before running tests**
      - name: Run Tests
        run: |
          echo "PYTHONPATH=$(pwd):$(pwd)/src:$(pwd)/covenant" >> $GITHUB_ENV
          pytest -q --disable-warnings
