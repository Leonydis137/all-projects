name: CI & Security Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ========================
  # 1️⃣ Linting Job
  # ========================
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Flake8
        run: pip install flake8

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}/src" >> $GITHUB_ENV

      - name: Run flake8
        run: flake8 covenant api src --max-line-length=100

  # ========================
  # 2️⃣ Testing Job
  # ========================
  test:
    runs-on: ubuntu-latest
    needs: lint   # optionally, only run tests if lint passes

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}/src" >> $GITHUB_ENV

      - name: Run Pytest
        run: pytest -q --disable-warnings

  # ========================
  # 3️⃣ Security Scan Job
  # ========================
  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install "safety<3.7" "typer<0.10" "rich<14"

      - name: Run Safety Security Scan
        run: |
          if [ -f requirements.txt ]; then
            safety check \
              --disable-audit-and-monitor \
              --full-report \
              -r requirements.txt
          else
            echo "No requirements.txt found, skipping Safety scan."
          fi
