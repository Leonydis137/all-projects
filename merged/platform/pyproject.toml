[project]
name = "omnis-platform"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2",
    "httpx>=0.27",
    "numpy>=1.26",
    "psycopg[binary]>=3.2",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "cryptography>=42",
]

[tool.vercel]
entrypoint = "omnis.api:app"
